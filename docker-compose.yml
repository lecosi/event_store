services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mis_eventos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mis_eventos}
      POSTGRES_DB: ${POSTGRES_DB:-mis_eventos}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Published on loopback only so host-side tests can reach it. Set DB_HOST_PORT
    # when another PostgreSQL already listens on 5432.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mis_eventos}:${POSTGRES_PASSWORD:-mis_eventos}@db:5432/${POSTGRES_DB:-mis_eventos}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:
